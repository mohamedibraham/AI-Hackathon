services:
  chroma:
    build:
      context: .
      dockerfile: Dockerfile.chroma
    image: my-custom-chroma:latest
    container_name: rag_chroma
    ports:

      - "8001:8001"
    volumes:
      - chroma_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v2/heartbeat')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  chroma_data: